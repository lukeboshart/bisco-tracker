const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const canon = n => CANON.get(n.toLowerCase()) || n.replace(/\s+/g," ");
const PARTIAL = /\((inverted|dyslexic|ending|end|beginning|begin|unfinished|partial|middle|reprise)\)/i;

function parseSetlist(raw){
  const sets=[];
  for (let line of String(raw||"").split(/\n+/)){
    line=line.trim(); if(!line) continue;
    let label="";
    const m=line.match(/^(set\s*[0-9ivx]+|encore\s*\d*|e\d*)\s*[:.\-–]\s*/i);
    if(m){ label=m[1].replace(/^e(\d*)$/i,"Encore $1").replace(/^(\w)/,c=>c.toUpperCase()).trim(); line=line.slice(m[0].length); }
    const parts=line.split(/\s*(->|→|>|,)\s*/);
    const songs=[];
    for(let i=0;i<parts.length;i+=2){
      let tok=(parts[i]||"").trim(); if(!tok) continue;
      const sep=parts[i+1]||"";
      const pm=tok.match(PARTIAL);
      tok=tok.replace(new RegExp(PARTIAL.source,"gi"),"").replace(/[*#^+]+$/,"").trim();
      if(!tok) continue;
      songs.push({name:canon(tok), partial:pm?pm[1].toLowerCase():null, segue:!!sep && sep!==","});
    }
    if(songs.length) sets.push({label:label||("Set "+(sets.length+1)), songs});
  }
  return sets;
}

function showSongs(sets){
  const m=new Map();
  for(const set of sets) for(const s of set.songs){
    const k=s.name.toLowerCase();
    const e=m.get(k)||{name:s.name,full:0,part:0};
    s.partial?e.part++:e.full++; m.set(k,e);
  }
  for(const e of m.values()) e.status=e.full?"full":e.part>=2?"pieced":"partial";
  return m;
}

function computeStats(shows){
  const sorted=[...shows].sort((a,b)=>a.date.localeCompare(b.date));
  const songs=new Map(), segues=new Map(), years=new Map(), venues=new Set();
  let performances=0;
  sorted.forEach((sh,idx)=>{
    venues.add((sh.venue||"")+"|"+(sh.city||""));
    const y=sh.date.slice(0,4); years.set(y,(years.get(y)||0)+1);
    const sets=parseSetlist(sh.raw);
    for(const set of sets){
      performances+=set.songs.length;
      set.songs.forEach((s,i)=>{ const nx=set.songs[i+1]; if(s.segue&&nx){ const k=s.name+"|"+nx.name; segues.set(k,(segues.get(k)||0)+1);} });
    }
    for(const [k,e] of showSongs(sets)){
      const st=songs.get(k)||{name:e.name,shows:0,whole:0,partOnly:0,dates:[],lastIdx:-1};
      st.shows++; e.status==="partial"?st.partOnly++:st.whole++;
      st.dates.push({date:sh.date,status:e.status}); st.lastIdx=idx; songs.set(k,st);
    }
  });
  const list=[...songs.values()].map(s=>({...s,gap:sorted.length-1-s.lastIdx,last:s.dates[s.dates.length-1].date}));
  list.sort((a,b)=>b.shows-a.shows||b.whole-a.whole||a.name.localeCompare(b.name));
  return {count:sorted.length, performances, venues:venues.size, list, segues:[...segues].sort((a,b)=>b[1]-a[1]),
    years:[...years].sort((a,b)=>a[0].localeCompare(b[0])), heard:new Set(songs.keys())};
}

const fmtDate = d => { const [y,m,dd]=d.split("-").map(Number); return new Date(y,m-1,dd).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); };
const stubDate = d => { const [y,m,dd]=d.split("-").map(Number); const dt=new Date(y,m-1,dd); return {day:dd, mon:dt.toLocaleDateString(undefined,{month:"short"}), yr:y}; };

let shows=[], loaded=false, mode="local", col=null, notice="", openShow=null, openSong=null, editing=null, confirmDel=null, query="", pickYear=new Date().getFullYear(), pickQuery="", pickRows=[], centeredYear=0;
const LS="bisco-tracker-shows";
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS)||"[]"); }catch(e){ return []; } }
function lsSave(){ try{ localStorage.setItem(LS,JSON.stringify(shows)); }catch(e){} }
function useLocal(msg){ mode="local"; shows=lsLoad(); loaded=true; notice=msg; render(); }

async function boot(){
  if(!window.claude||!window.claude.use){ useLocal("Saving on this device only."); return; }
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  const uid=user?await user.id():null;
  if(!db||!uid){ useLocal("Sign in to keep your shows across devices. For now they save on this device only."); return; }
  mode="db"; col=db.collection("data/users/"+uid);
  const timer=setTimeout(()=>{ notice="Your shows can't be reached yet. Check your connection; this will update when it's back."; render(); },10000);
  col.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ clearTimeout(timer); notice=""; }
    shows=snap.docs.map(d=>({id:d.id,...d.data()})); loaded=true; render();
  }, err=>{ clearTimeout(timer); useLocal("Couldn't reach your saved shows ("+err.code+"). Saving on this device for now."); });
}

async function saveShow(data){
  if(mode==="db"){
    const ref=data.id?col.doc(data.id):col.doc();
    const {id,...body}=data; await ref.set(body);
  } else {
    if(data.id) shows=shows.map(s=>s.id===data.id?data:s);
    else shows.push({...data,id:"s"+Date.now().toString(36)});
    lsSave(); render();
  }
}
async function deleteShow(id){
  if(mode==="db") await col.doc(id).delete();
  else { shows=shows.filter(s=>s.id!==id); lsSave(); render(); }
}

/* ---------- BIP (Bisco Internet Project connector) ---------- */
const BIP="Bisco internet project";
let mcp=null, bipState="checking";
const yearCache={};
async function bootBip(){
  if(!window.claude||!window.claude.use){ bipState="none"; render(); return; }
  mcp=await window.claude.use("mcp"); bipState=mcp?"ready":"none";
  if(mcp&&view()==="add") loadYear(pickYear);
  render();
}
function bipErr(e){
  const c=e&&e.code;
  if(c==="server_not_connected"||c==="server_not_found") return {msg:"Add the Bisco Internet Project connector in claude.ai Settings → Connectors, then reopen this page.",retry:false};
  if(c==="needs_reauth") return {msg:"Reconnect the Bisco Internet Project connector in claude.ai Settings → Connectors.",retry:false};
  if(c==="selection_required") return {msg:"You have more than one BIP connector. Pick one when Claude asks, then try again.",retry:true};
  if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required") return {msg:"This page needs your OK to read shows from BIP.",retry:true,label:"Allow BIP"};
  if(c==="blocked_by_policy") return {msg:"Your organization blocks this connector for you.",retry:false};
  if(c==="server_unavailable"||c==="rate_limited") return {msg:"BIP isn't answering right now.",retry:true};
  if(c==="tool_error") return {msg:"BIP couldn't return that. "+String(e.message||"").slice(0,140),retry:true};
  if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed") return {msg:"BIP can't be reached from this view.",retry:false};
  return {msg:"Something went wrong reaching BIP.",retry:true};
}
async function loadYear(y){
  if(!mcp) return;
  const c=yearCache[y]; if(c&&(c.status==="ok"||c.status==="loading")) return;
  yearCache[y]={status:"loading"}; render();
  try{
    const r=await mcp.callTool(BIP,"get_shows_by_year",{year:y,limit:500},{cache:{staleTime:86400000,gcTime:604800000}});
    const list=(r.payload&&Array.isArray(r.payload.shows))?r.payload.shows:[];
    yearCache[y]={status:"ok",rows:list.filter(x=>x&&x.date).map(x=>({date:x.date,venue:x.venueName||"Unknown venue",city:[x.venueCity,x.venueState].filter(Boolean).join(", "),slug:x.slug}))};
  }catch(e){ yearCache[y]={status:"error",err:bipErr(e)}; }
  render();
}
function setLabel(n,i){
  const m=String(n||"").match(/^([SE])(\d*)$/i);
  if(m) return m[1].toUpperCase()==="E" ? (m[2]&&m[2]!=="1"?"Encore "+m[2]:"Encore") : "Set "+(m[2]||1);
  return /^(set\s*[0-9ivx]+|encore\s*\d*)$/i.test(String(n||"").trim()) ? String(n).trim() : "Set "+(i+1);
}
function partialTag(n){ const m=String(n||"").match(/inverted|dyslexic|unfinished|ending|beginning|partial/i); return m?m[0].toLowerCase():""; }
function bipToRaw(p){
  const sets=(p&&Array.isArray(p.sets))?p.sets:[];
  return sets.map((set,si)=>{
    const tr=[...(set.tracks||[])].filter(t=>t&&t.song).sort((a,b)=>(a.position||0)-(b.position||0));
    if(!tr.length) return "";
    return setLabel(set.name,si)+": "+tr.map((t,i)=>{ const tag=partialTag(t.notes); const sg=String(t.segue||"").trim();
      return t.song+(tag?" ("+tag+")":"")+(i<tr.length-1?(sg&&sg!==","?" > ":", "):""); }).join("");
  }).filter(Boolean).join("\n");
}
async function loadSetlist(slug){
  if(!mcp||!editing) return;
  editing.bip={status:"loading"}; render();
  let next;
  try{
    const r=await mcp.callTool(BIP,"get_setlist",{slug},{cache:{staleTime:3600000,gcTime:604800000}});
    const raw=bipToRaw(r.payload); next={status:raw?"ok":"empty",raw};
  }catch(e){ next={status:"error",err:bipErr(e)}; }
  if(!editing||editing.slug!==slug) return;
  if(next.raw && !editing.raw) editing.raw=next.raw;
  editing.bip={status:next.status,err:next.err}; render();
}

function directoryShows(year){
  const m=new Map(), c=yearCache[year];
  const base=(c&&c.status==="ok")?c.rows:DIRECTORY.filter(d=>+d.date.slice(0,4)===year);
  for(const d of base) m.set(d.slug||(d.date+"|"+d.venue.toLowerCase()),{...d});
  for(const s of shows){
    if(+String(s.date).slice(0,4)!==year) continue;
    let k=s.slug&&m.has(s.slug)?s.slug:null;
    if(!k){ const dk=s.date+"|"+(s.venue||"").toLowerCase(); k=[...m.keys()].find(x=>{const r=m.get(x);return r.date===s.date&&(r.venue||"").toLowerCase()===(s.venue||"").toLowerCase();})||dk; }
    m.set(k,{...(m.get(k)||{}),date:s.date,venue:s.venue||(m.get(k)||{}).venue||"Unknown venue",city:s.city||(m.get(k)||{}).city||"",logged:s.id});

}

      :(c&&c.status==="loading")||bipState==="checking"?"":`<div class="empty">${pickQuery?`No ${pickYear} shows match “${esc(pickQuery)}”.`:`No shows listed for ${pickYear}.`}</div>`}

document.addEventListener("click",e=>{

  if(!t) return;

  else if(t.dataset.edit){ editing={...shows.find(s=>s.id===t.dataset.edit)}; location.hash="add"; render(); }
  else if(t.dataset.askdel){ confirmDel=t.dataset.askdel; render(); }

  else if(t.dataset.del){ const id=t.dataset.del; confirmDel=null; deleteShow(id).catch(()=>{ notice="That show couldn't be deleted. Try again in a moment."; render(); }); }
  else if(t.dataset.go){ location.hash=t.dataset.go; }
  else if(t.matches("tr.song")){ openSong=openSong===t.dataset.song?null:t.dataset.song; render(); }
  else if(t.id==="cancel"){ editing=null; location.hash="shows"; }
  else if(t.dataset.year){ pickYear=+t.dataset.year; pickQuery=""; render(); loadYear(pickYear); }
  else if(t.dataset.retryyear){ const y=+t.dataset.retryyear; delete yearCache[y]; loadYear(y); }
  else if(t.id==="retryset"){ if(editing&&editing.slug) loadSetlist(editing.slug); }
  else if(t.dataset.pick){ const r=pickRows[+t.dataset.pick]; if(!r) return;
    if(r.logged){ editing={...shows.find(s=>s.id===r.logged)}; render(); }
    else { editing={date:r.date,venue:r.venue,city:r.city,raw:"",slug:r.slug||null}; render(); if(r.slug) loadSetlist(r.slug); }
    window.scrollTo(0,0); }
  else if(t.id==="manual"){ editing={date:"",venue:"",city:"",raw:""}; render(); }
  else if(t.id==="backpick"){ editing=null; render(); }
});
document.addEventListener("input",e=>{
  if(e.target.id==="songsearch"){ query=e.target.value; render(); }
  if(e.target.id==="pickquery"){ pickQuery=e.target.value; render(); }
  if(editing&&e.target.id&&e.target.id.startsWith("f-")){ editing[e.target.id.slice(2)]=e.target.value; }
  if(e.target.id==="f-raw"){ document.getElementById("preview").innerHTML=setlistHTML(e.target.value); }
  if(e.target.id==="f-date"){ document.getElementById("sfm").href="https://www.setlist.fm/search?query="+encodeURIComponent("Disco Biscuits "+e.target.value); }
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="showform") return;
  e.preventDefault();
  const v=id=>document.getElementById(id).value.trim();
  const rec={date:v("f-date"),venue:v("f-venue"),city:v("f-city"),raw:document.getElementById("f-raw").value.trim()};
  const msg=document.getElementById("formmsg");
  if(!rec.date){ msg.textContent="Pick the date of the show."; return; }
  if(!parseSetlist(rec.raw).length){ msg.textContent="Add at least one song to the setlist."; return; }
  if(editing&&editing.id) rec.id=editing.id;
  if(editing&&editing.slug){ rec.slug=editing.slug; rec.source="bip"; }
  msg.textContent="Saving…";
  try{ await saveShow(rec); editing=null; openShow=null; location.hash="shows"; render(); }
  catch(err){ msg.textContent="The show couldn't be saved. Check your connection and try again."; }
});
window.addEventListener("hashchange",()=>{ if(view()!=="add") editing=null; window.scrollTo(0,0); render(); if(view()==="add") loadYear(pickYear); });
render();
boot();
bootBip();
</script>
